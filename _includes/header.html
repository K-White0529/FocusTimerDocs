<header class="site-header" role="banner">
  <div class="wrapper">
    {% assign is_english = page.path | slice: 0, 3 %}
    {% if is_english == "en/" %}
      <a class="site-title" rel="author" href="{{ '/en/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484S0.665,0,1.484,0h15.031C17.335,0,18,0.665,18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516s0.665-1.484,1.484-1.484h15.031C17.335,6.031,18,6.696,18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516s0.665-1.483,1.484-1.483h15.031C17.335,12.031,18,12.696,18,13.516z"/>
            </svg>
          </span>
        </label>
        <div class="trigger">
          <a class="page-link" href="{{ '/en/help.html' | relative_url }}">Help</a>
          <a class="page-link" href="{{ '/en/contact.html' | relative_url }}">Contact</a>
          <a class="page-link" href="{{ '/en/privacy-policy.html' | relative_url }}">Privacy Policy</a>
          <a class="page-link" href="{{ '/' | relative_url }}">日本語</a>
        </div>
      </nav>
    {% else %}
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484S0.665,0,1.484,0h15.031C17.335,0,18,0.665,18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516s0.665-1.484,1.484-1.484h15.031C17.335,6.031,18,6.696,18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516s0.665-1.483,1.484-1.483h15.031C17.335,12.031,18,12.696,18,13.516z"/>
            </svg>
          </span>
        </label>
        <div class="trigger">
          <a class="page-link" href="{{ '/help.html' | relative_url }}">使い方</a>
          <a class="page-link" href="{{ '/contact.html' | relative_url }}">問い合わせ</a>
          <a class="page-link" href="{{ '/privacy-policy.html' | relative_url }}">プライバシーポリシー</a>
          <a class="page-link" href="{{ '/en/' | relative_url }}">English</a>
        </div>
      </nav>
    {% endif %}
  </div>
</header>
